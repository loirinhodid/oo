<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#080a0f" />
  <title>Rover Client</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark">R</span><b>ROVER</b><span>CLIENT</span></div>
    <div class="window-actions"><button data-window="minimize">−</button><button data-window="maximize">□</button><button data-window="close">×</button></div>
  </header>
  <aside class="sidebar">
    <div class="side-main">
      <button class="nav active" data-view="library">⌂<span>Biblioteca</span></button>
      <button class="nav" data-view="friends">♧<span>Amigos</span></button>
      <button class="nav" data-view="social">◌<span>Social</span></button>
      <button class="nav" data-view="settings">⚙<span>Personalizar</span></button>
    </div>
    <div class="side-user"><div class="avatar">P</div><div><b>Prometheos</b><small>Nível 1 · 0 XP</small></div></div>
  </aside>
  <main id="app"></main>
  <script src="./app.js"></script>
</body>
</html>
